baseURL = 'https://kintomzi.github.io/'
languageCode = 'en-us'
title = 'Github.io'

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
enableGitInfo = false


[params]
  github_username = 'KintomZi'
  author_name = 'Jindong'
  csdn_url = 'https://blog.csdn.net/Z_JingD?type=blog'
  interests = ['Remote Sensing', 'LiDAR', 'Deep Learning']

[taxonomies]
  category = 'categories'

[languages.en]
  languageName = 'EN'
  contentDir = 'content/en'
  weight = 1

[languages.zh]
  languageName = '中'
  contentDir = 'content/zh'
  weight = 2


